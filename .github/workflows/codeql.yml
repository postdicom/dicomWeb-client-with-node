name: CodeQL YML

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '*.yml'
      - '*.json'
      - 'docs/**'
      - '.github/**'
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          build-mode: none

      - uses: github/codeql-action/analyze@v3
